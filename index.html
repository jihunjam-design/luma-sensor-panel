<h1>Luma Sensor Panel</h1>
<p>Luma Sensor Panel은 개인이 자신의 Windows PC에서 사용하는 데스크톱 센서 패널입니다. CPU·GPU 상태, 재생 중인 음악, 날씨와 함께 본인의 Google 캘린더 일정과 Google Tasks 할 일을 화면에 표시합니다.</p>
<p>이 앱은 배포·판매하지 않으며, 개발자 본인만 사용합니다.</p>
